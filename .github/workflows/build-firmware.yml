name: Build & Release Firmware

on:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history needed for changelog

      - name: Install arduino-cli
        run: |
          curl -fsSL https://raw.githubusercontent.com/arduino/arduino-cli/master/install.sh \
            | BINDIR=/usr/local/bin sh

      - name: Cache arduino-cli data
        uses: actions/cache@v4
        with:
          path: |
            ~/.arduino15
            ~/Arduino/libraries
          key: arduino-${{ runner.os }}-${{ hashFiles('**/build-firmware.yml') }}
          restore-keys: |
            arduino-${{ runner.os }}-

      - name: Configure arduino-cli
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json

      - name: Update board index
        run: arduino-cli core update-index

      # Pinned: the firmware relies on this core's HTTPUpdate (SHA-256 checks) and
      # on the certificate bundle compiled into its mbedTLS
      - name: Install ESP32 core
        run: arduino-cli core install esp32:esp32@3.3.12

      - name: Install Arduino registry libraries
        run: |
          arduino-cli lib install "ArduinoJson@6.21.5"
          arduino-cli lib install "PubSubClient@2.8.0"

      - name: Install AsyncTCP (GitHub)
        run: |
          [ -d ~/Arduino/libraries/AsyncTCP ] || \
            git clone --depth 1 https://github.com/me-no-dev/AsyncTCP \
              ~/Arduino/libraries/AsyncTCP

      - name: Install ESPAsyncWebServer (GitHub)
        run: |
          [ -d ~/Arduino/libraries/ESPAsyncWebServer ] || \
            git clone --depth 1 https://github.com/me-no-dev/ESPAsyncWebServer \
              ~/Arduino/libraries/ESPAsyncWebServer

      - name: Extract firmware version
        id: version
        run: |
          VERSION=$(grep -oP '(?<=DEVICE_VERSION = ")[\d.]+(?=")' code/code.ino)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}-build${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      # min_spiffs: two 1.875 MB app slots (OTA) and a 128 KB SPIFFS the firmware
      # doesn't use. Units built before v3.6.0 have 1.25 MB slots and need one USB
      # flash to change layout — see the release notes below.
      - name: Compile firmware
        run: |
          arduino-cli compile \
            --fqbn esp32:esp32:esp32 \
            --build-property "build.partitions=min_spiffs" \
            --build-property "upload.maximum_size=1966080" \
            --output-dir build/ \
            code/

      - name: Rename firmware binary
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          mv build/code.ino.bin            "build/aquasensys-firmware-${TAG}.bin"
          mv build/code.ino.bootloader.bin "build/bootloader-${TAG}.bin"
          mv build/code.ino.partitions.bin "build/partitions-${TAG}.bin"
          # Bootloader + partition table + boot selector + firmware in one 4 MB
          # image, written at 0x0: the simplest way to flash a unit over USB
          mv build/code.ino.merged.bin     "build/aquasensys-full-${TAG}.bin"
          cp "$(ls -d ~/.arduino15/packages/esp32/hardware/esp32/*/ | tail -1)tools/partitions/boot_app0.bin" build/boot_app0.bin
          echo "BIN_PATH=build/aquasensys-firmware-${TAG}.bin"  >> "$GITHUB_ENV"
          echo "BIN_NAME=aquasensys-firmware-${TAG}.bin"         >> "$GITHUB_ENV"
          echo "BOOT_PATH=build/bootloader-${TAG}.bin"           >> "$GITHUB_ENV"
          echo "PART_PATH=build/partitions-${TAG}.bin"           >> "$GITHUB_ENV"
          echo "FULL_PATH=build/aquasensys-full-${TAG}.bin"      >> "$GITHUB_ENV"

      - name: Package SD assets
        run: |
          cd code/sd && zip -0 -r ../../build/sd-assets.zip . --exclude='config.json'

      - name: Generate release notes
        run: |
          git fetch --tags
          THIS_TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${THIS_TAG}$" | head -1)
          {
            echo "## AquaSensys ${VERSION}"
            echo ""
            echo "Built from commit \`${{ github.sha }}\` on \`main\`. See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for what changed."
            echo ""
            if [ -n "$PREV_TAG" ]; then
              echo "### Commits since ${PREV_TAG}"
              git log --oneline "${PREV_TAG}..HEAD"
            else
              echo "### Recent commits"
              git log --oneline -10
            fi
            echo ""
            sed -e "s/__TAG__/${THIS_TAG}/g" <<'NOTES'
          ### Assets
          | File | What it is |
          |---|---|
          | `aquasensys-firmware-__TAG__.bin` | Firmware — for updates (automatic, or the device's firmware update page) |
          | `sd-assets.zip` | Web UI for the SD card — installed with automatic updates, or through `/upload` |
          | `aquasensys-full-__TAG__.bin` | Complete flash image for a **USB** flash (bootloader, partition table and firmware) |
          | `bootloader-__TAG__.bin`, `partitions-__TAG__.bin`, `boot_app0.bin` | The same, as separate files, for a manual USB flash |

          ### Updating a unit that already runs v3.6.0 or later
          The dashboard shows **"Firmware … is available"** with an **Install** button, and Home
          Assistant lists the unit under **Settings → Updates**. Installing downloads the firmware
          and the web UI from this release, checks them, and restarts the unit (about a minute).
          A Controller's pump stops during the restart and starts again by itself.

          ### Units on v3.5.0 or older: flash once over USB
          v3.6.0 changes the flash layout (partition table) to make room for automatic updates,
          and a partition table can only be written over USB. Each unit needs this **once**;
          from then on it updates itself. Uploading this firmware through the old update page
          does not work: the unit refuses it ("Not enough space") and keeps running as before.

          `config.json` (WiFi, MQTT, calibration), the web UI and the logs live on the SD card
          and are not touched. Leave the card in.

          **You need:** a USB data cable, and a computer with Chrome or Edge (option A) or
          Python (option B). If the computer doesn't see a serial port when the ESP32 is plugged
          in, install the USB driver for the board's chip (CP210x or CH340).

          **Option A — in the browser, nothing to install**
          1. Download `aquasensys-full-__TAG__.bin` from this release.
          2. **Switch off the unit's mains supply before opening it.** Connect the ESP32 to
             the computer by USB; it runs from the USB power while it is flashed.
          3. Open <https://espressif.github.io/esptool-js/> in Chrome or Edge.
          4. Set **Baudrate** to `460800`, click **Connect** and pick the serial port.
             If it doesn't connect, hold the ESP32's **BOOT** button, click **Connect**, and
             release the button once it has connected.
          5. Under **Program**, set **Flash Address** to `0x0`, choose
             `aquasensys-full-__TAG__.bin`, and click **Program**. Wait for it to finish
             (about a minute).
          6. Click **Disconnect**, then press the ESP32's **EN**/**RST** button or unplug it.
             Put the unit back: it starts on v3.6.0.

          **Option B — esptool on the command line**
          ```bash
          pip install esptool
          python -m esptool --chip esp32 --port COM3 --baud 460800 write_flash 0x0 aquasensys-full-__TAG__.bin
          ```
          The port is `COM3`, `COM4`, … on Windows, `/dev/ttyUSB0` on Linux and
          `/dev/cu.usbserial-…` on macOS. Hold **BOOT** if it stays on "Connecting...".

          **Separate files instead of the full image** (same result):
          ```bash
          python -m esptool --chip esp32 --port COM3 --baud 460800 write_flash \
            0x1000  bootloader-__TAG__.bin \
            0x8000  partitions-__TAG__.bin \
            0xe000  boot_app0.bin \
            0x10000 aquasensys-firmware-__TAG__.bin
          ```
          Don't leave out `boot_app0.bin` at `0xe000`: it resets the record of which app slot
          to start. Without it, a unit whose last update went into its second slot keeps
          pointing at that slot, which in the new layout holds leftovers of the old firmware,
          and may not start.

          The full image covers the whole 4 MB flash, so it also clears the ESP32's internal
          settings area (NVS). AquaSensys keeps nothing there.

          ### Board
          - FQBN: `esp32:esp32:esp32`, core 3.3.12
          - Partition scheme: `min_spiffs` (OTA, 1.875 MB per app slot)
          NOTES
          } > build/release_notes.md

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}
          path: ${{ env.BIN_PATH }}
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "AquaSensys ${{ steps.version.outputs.tag }}"
          body_path: build/release_notes.md
          files: |
            ${{ env.BIN_PATH }}
            ${{ env.FULL_PATH }}
            ${{ env.BOOT_PATH }}
            ${{ env.PART_PATH }}
            build/boot_app0.bin
            build/sd-assets.zip
          fail_on_unmatched_files: true
